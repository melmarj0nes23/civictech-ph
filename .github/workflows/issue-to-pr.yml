name: Directory Submission to PR

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: contains(github.event.issue.labels.*.name, 'directory-submission') || contains(github.event.issue.labels.*.name, 'directory-update') || startsWith(github.event.issue.title, '[Directory]:') || startsWith(github.event.issue.title, 'Post an update:') || contains(github.event.issue.body, '### Project or Organization Name') || contains(github.event.issue.body, '### Update title')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse submission or update and create PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const issue = context.payload.issue;
            const body = issue.body || '';

            function extractField(heading) {
              const regex = new RegExp(`### ${heading}\\s+([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              const val = match ? match[1].trim() : '';
              return val === '_No response_' ? '' : val;
            }

            const baseBranch = context.payload.repository.default_branch;
            const today = new Date().toISOString().slice(0, 10);

            const isUpdate =
              issue.title.startsWith('Post an update:') ||
              body.includes('### Update title');

            if (isUpdate) {
              const projectRaw = extractField('Project or CSO') || extractField('Project');
              const newStageRaw = extractField('Stage \\(optional\\)');
              const newWebsite = extractField('Website \\(optional\\)');
              const newRepo = extractField('Source code \\(optional\\)');
              const updateTitle = extractField('Update title');
              const updateBody = extractField('What changed');

              if (!projectRaw || !updateTitle || !updateBody) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'Could not parse all required update fields. Please make sure Project/CSO, Update title, and What changed are filled out.',
                });
                return;
              }

              const slug = projectRaw.split('/').filter(Boolean).pop().toLowerCase();
              let filePath = '';
              for (const folder of ['projects', 'csos']) {
                const candidate = `content/${folder}/${slug}/index.md`;
                if (fs.existsSync(candidate)) {
                  filePath = candidate;
                  break;
                }
              }

              if (!filePath) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Could not find an entry matching \`${slug}\` in \`content/projects/\` or \`content/csos/\`.`,
                });
                return;
              }

              let existing = fs.readFileSync(filePath, 'utf8');
              const validStages = new Set(['planning', 'alpha', 'beta', 'stable', 'archived']);
              const stageLower = newStageRaw.toLowerCase();
              const escUpdate = (s) => s.replace(/'/g, "''").replace(/\r?\n/g, ' ');
              const setFrontmatterField = (md, key, value) => {
                const re = new RegExp(`^${key}:.*$`, 'm');
                if (re.test(md)) {
                  return md.replace(re, `${key}: '${escUpdate(value)}'`);
                }
                return md.replace(/^---\r?\n([\s\S]*?)\r?\n---/, `---\n$1\n${key}: '${escUpdate(value)}'\n---`);
              };

              if (validStages.has(stageLower)) {
                existing = setFrontmatterField(existing, 'status', stageLower);
              }
              if (newWebsite) {
                existing = setFrontmatterField(existing, 'website', newWebsite);
              }
              if (newRepo) {
                existing = setFrontmatterField(existing, 'repoUrl', newRepo);
              }
              existing = setFrontmatterField(existing, 'lastUpdated', today);
              const updatedContent = `${existing.trimEnd()}\n\n## Update (${today}): ${updateTitle}\n\n${updateBody.slice(0, 1200)}\n`;

              const branch = `update/${slug}-${issue.number}`;
              const { data: refData } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${baseBranch}`,
              });
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/heads/${branch}`,
                  sha: refData.object.sha,
                });
              } catch (err) {
                if (err.status !== 422) throw err;
              }

              const { data: existingFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                ref: baseBranch,
              });

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message: `Update ${slug}: ${updateTitle}`,
                content: Buffer.from(updatedContent, 'utf8').toString('base64'),
                sha: existingFile.sha,
                branch,
              });

              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Update ${slug}: ${updateTitle}`,
                head: branch,
                base: baseBranch,
                body: `Automated update PR from #${issue.number} by @${issue.user.login}.\n\nCloses #${issue.number}`,
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Update pull request created: #${pr.number}. A maintainer will review and merge it shortly.`,
              });
              return;
            }

            const kindRaw = extractField('Entry Type');
            const name = extractField('Project or Organization Name');
            const summary =
              extractField('One-line summary') ||
              extractField('Short Summary \\(up to 240 characters\\)');
            const description = extractField('What it does and who it helps');
            const statusRaw = extractField('Stage');
            const sector = extractField('Primary Sector');
            const website =
              extractField('Website') || extractField('Website or Repository URL');
            const repoUrl = extractField('Source code');
            const license = extractField('License');
            const tagsRaw = extractField('Tags');
            const maintainersRaw = extractField('Maintainers');

            if (!name || !sector || !summary) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Could not parse all required fields from this submission. Please make sure all required form fields are filled out.',
              });
              return;
            }

            const allowedStatuses = new Set(['planning', 'alpha', 'beta', 'stable']);
            const statusLower = statusRaw.toLowerCase();
            const status = allowedStatuses.has(statusLower) ? statusLower : 'beta';

            const isCso = kindRaw.toLowerCase().includes('cso');
            const folder = isCso ? 'csos' : 'projects';
            const slug = name
              .normalize('NFKD')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 60)
              .replace(/-+$/, '');

            if (!slug) {
              throw new Error('Could not generate a valid slug from the submission name.');
            }

            const esc = (s) => s.replace(/'/g, "''").replace(/\r?\n/g, ' ');
            const parseCsv = (raw, max) =>
              raw
                ? raw
                    .split(',')
                    .map((s) => s.trim())
                    .filter(Boolean)
                    .slice(0, max)
                : [];

            const tags = parseCsv(tagsRaw, 8);
            const maintainers = parseCsv(maintainersRaw, 10);

            const lines = [
              '---',
              `title: '${esc(name)}'`,
              `summary: '${esc(summary.slice(0, 240))}'`,
              `status: '${status}'`,
              `sectors: ['${esc(sector)}']`,
            ];
            if (website) lines.push(`website: '${esc(website)}'`);
            if (repoUrl) lines.push(`repoUrl: '${esc(repoUrl)}'`);
            if (license) lines.push(`license: '${esc(license.slice(0, 40))}'`);
            lines.push(`owner: '${issue.user.login}'`);
            lines.push(
              `maintainers: [${maintainers.map((m) => `'${esc(m)}'`).join(', ')}]`
            );
            lines.push(`tags: [${tags.map((t) => `'${esc(t)}'`).join(', ')}]`);
            lines.push(`dateAdded: '${today}'`);
            lines.push('---');
            if (description) {
              lines.push('');
              lines.push(description.slice(0, 1200));
            }
            lines.push('');

            const markdown = lines.join('\n');
            const filePath = `content/${folder}/${slug}/index.md`;
            const branch = `submission/${slug}-${issue.number}`;

            const { data: refData } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`,
            });

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: refData.object.sha,
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `Add ${isCso ? 'CSO' : 'project'}: ${name}`,
              content: Buffer.from(markdown, 'utf8').toString('base64'),
              branch,
            });

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Add ${isCso ? 'CSO' : 'project'}: ${name}`,
              head: branch,
              base: baseBranch,
              body: `Automated PR from submission #${issue.number} by @${issue.user.login}.\n\nCloses #${issue.number}`,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Pull request created: #${pr.number}. A maintainer will review and merge it shortly.`,
            });
