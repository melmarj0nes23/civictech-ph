name: Directory Submission to PR

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: contains(github.event.issue.labels.*.name, 'directory-submission') || startsWith(github.event.issue.title, '[Directory]:') || contains(github.event.issue.body, '### Project or Organization Name')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse submission and create PR
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            function extractField(heading) {
              const regex = new RegExp(`### ${heading}\\s+([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              const val = match ? match[1].trim() : '';
              return val === '_No response_' ? '' : val;
            }

            const kindRaw = extractField('Entry Type');
            const name = extractField('Project or Organization Name');
            const summary =
              extractField('One-line summary') ||
              extractField('Short Summary \\(up to 240 characters\\)');
            const description = extractField('What it does and who it helps');
            const statusRaw = extractField('Stage');
            const sector = extractField('Primary Sector');
            const website =
              extractField('Website') || extractField('Website or Repository URL');
            const repoUrl = extractField('Source code');
            const license = extractField('License');
            const tagsRaw = extractField('Tags');
            const maintainersRaw = extractField('Maintainers');

            if (!name || !sector || !summary) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Could not parse all required fields from this submission. Please make sure all required form fields are filled out.',
              });
              return;
            }

            const allowedStatuses = new Set(['planning', 'alpha', 'beta', 'stable']);
            const statusLower = statusRaw.toLowerCase();
            const status = allowedStatuses.has(statusLower) ? statusLower : 'beta';

            const isCso = kindRaw.toLowerCase().includes('cso');
            const folder = isCso ? 'csos' : 'projects';
            const slug = name
              .normalize('NFKD')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 60)
              .replace(/-+$/, '');

            if (!slug) {
              throw new Error('Could not generate a valid slug from the submission name.');
            }

            const today = new Date().toISOString().slice(0, 10);
            const esc = (s) => s.replace(/'/g, "''").replace(/\r?\n/g, ' ');
            const parseCsv = (raw, max) =>
              raw
                ? raw
                    .split(',')
                    .map((s) => s.trim())
                    .filter(Boolean)
                    .slice(0, max)
                : [];

            const tags = parseCsv(tagsRaw, 8);
            const maintainers = parseCsv(maintainersRaw, 10);

            const lines = [
              '---',
              `title: '${esc(name)}'`,
              `summary: '${esc(summary.slice(0, 240))}'`,
              `status: '${status}'`,
              `sectors: ['${esc(sector)}']`,
            ];
            if (website) lines.push(`website: '${esc(website)}'`);
            if (repoUrl) lines.push(`repoUrl: '${esc(repoUrl)}'`);
            if (license) lines.push(`license: '${esc(license.slice(0, 40))}'`);
            lines.push(`owner: '${issue.user.login}'`);
            lines.push(
              `maintainers: [${maintainers.map((m) => `'${esc(m)}'`).join(', ')}]`
            );
            lines.push(`tags: [${tags.map((t) => `'${esc(t)}'`).join(', ')}]`);
            lines.push(`dateAdded: '${today}'`);
            lines.push('---');
            if (description) {
              lines.push('');
              lines.push(description.slice(0, 1200));
            }
            lines.push('');

            const markdown = lines.join('\n');
            const filePath = `content/${folder}/${slug}/index.md`;
            const branch = `submission/${slug}-${issue.number}`;
            const baseBranch = context.payload.repository.default_branch;

            const { data: refData } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`,
            });

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: refData.object.sha,
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filePath,
              message: `Add ${isCso ? 'CSO' : 'project'}: ${name}`,
              content: Buffer.from(markdown, 'utf8').toString('base64'),
              branch,
            });

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Add ${isCso ? 'CSO' : 'project'}: ${name}`,
              head: branch,
              base: baseBranch,
              body: `Automated PR from submission #${issue.number} by @${issue.user.login}.\n\nCloses #${issue.number}`,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Pull request created: #${pr.number}. A maintainer will review and merge it shortly.`,
            });
